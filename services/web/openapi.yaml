openapi: 3.1.0
info:
  title: Overleaf Project Content API
  version: "1.0.0"
  description: |
    API para consultar la estructura de un proyecto y descargar un fichero por subruta.
servers:
  - url: /
paths:
  /api/v1/token:
    post:
      operationId: issueProjectContentApiToken
      summary: Obtener token Bearer con usuario y contraseña
      description: Emite un token Bearer para consumir la API de contenidos de proyecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              byEmail:
                value:
                  email: "user@example.com"
                  password: "my-password"
              byUsername:
                value:
                  username: "user@example.com"
                  password: "my-password"
      responses:
        "200":
          description: Token emitido correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Faltan credenciales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingFields:
                  value:
                    error: username and password are required
        "401":
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid:
                  value:
                    error: invalid_credentials
  /user/projects/summary:
    get:
      operationId: getUserProjectsSummary
      summary: Obtener listado simple de proyectos del usuario
      description: Devuelve los proyectos visibles por el usuario autenticado con su ID y nombre.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listado de proyectos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummaryResponse"
              examples:
                ok:
                  value:
                    userId: "65f2f57f8d6c0b6d503000aa"
                    projects:
                      - project_id: "65f2f57f8d6c0b6d50300001"
                        projectName: "My project"
                      - project_id: "65f2f57f8d6c0b6d50300002"
                        projectName: "Shared project"
        "401":
          description: No autenticado.
  /project/{Project_id}/structure:
    get:
      operationId: getProjectStructure
      summary: Obtener estructura de un proyecto
      description: Devuelve el árbol completo del proyecto (carpetas, docs y ficheros binarios).
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Estructura del proyecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStructureResponse"
              examples:
                ok:
                  value:
                    project_id: "65f2f57f8d6c0b6d50300001"
                    projectName: "My project"
                    rootDocId: "65f2f57f8d6c0b6d50300010"
                    structure:
                      _id: "65f2f57f8d6c0b6d50300020"
                      name: "rootFolder"
                      type: "folder"
                      path: ""
                      folders:
                        - _id: "65f2f57f8d6c0b6d50300030"
                          name: "src"
                          type: "folder"
                          path: "src"
                          folders: []
                          docs:
                            - _id: "65f2f57f8d6c0b6d50300040"
                              name: "chapter1.tex"
                              type: "doc"
                              path: "src/chapter1.tex"
                          files:
                            - _id: "65f2f57f8d6c0b6d50300050"
                              name: "image.png"
                              type: "file"
                              path: "src/image.png"
                      docs:
                        - _id: "65f2f57f8d6c0b6d50300010"
                          name: "main.tex"
                          type: "doc"
                          path: "main.tex"
                      files:
                        - _id: "65f2f57f8d6c0b6d50300060"
                          name: "refs.bib"
                          type: "file"
                          path: "refs.bib"
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para leer el proyecto.
        "404":
          description: Proyecto no encontrado.
        "500":
          description: Error interno.
  /project/{Project_id}/download/compiled-pdf/by-path/{path}:
    get:
      operationId: downloadCompiledPdfByPath
      summary: Compilar y descargar PDF desde una subruta LaTeX
      description: |
        Localiza un documento por su subruta y, si apunta a un documento LaTeX (`.tex`),
        compila el proyecto usando ese documento como raíz y devuelve `output.pdf`.
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
        - name: path
          in: path
          required: true
          allowReserved: true
          description: Subruta del documento `.tex` dentro del proyecto.
          schema:
            type: string
            minLength: 1
          example: src/main.tex
      responses:
        "200":
          description: PDF compilado.
          headers:
            Content-Disposition:
              description: Cabecera de descarga/renderizado del PDF.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Ruta inválida o no apunta a un documento LaTeX.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingPath:
                  value:
                    error: path is required
                nonLatex:
                  value:
                    error: path must point to a latex document (.tex)
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para leer el proyecto.
        "404":
          description: Proyecto o ruta no encontrada.
        "500":
          description: Error de compilación o descarga.
  /project/{Project_id}/download/by-path/{path}:
    get:
      operationId: downloadProjectEntityByPath
      summary: Descargar fichero del proyecto por subruta
      description: |
        Descarga un documento (`doc`) o fichero binario (`file`) del proyecto a partir de su subruta.
        La subruta es relativa a la raíz del proyecto (ej: `src/main.tex`).
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
        - name: path
          in: path
          required: true
          allowReserved: true
          description: Subruta del fichero dentro del proyecto.
          schema:
            type: string
            minLength: 1
          example: src/main.tex
      responses:
        "200":
          description: Contenido del fichero solicitado.
          headers:
            Content-Disposition:
              description: Cabecera de adjunto con el nombre de fichero.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              description: Respuesta cuando el recurso es un documento (`doc`).
            application/octet-stream:
              schema:
                type: string
                format: binary
              description: Respuesta cuando el recurso es un fichero binario (`file`).
        "400":
          description: La ruta es inválida o apunta a una carpeta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                folderPath:
                  value:
                    error: path points to a folder
                missingPath:
                  value:
                    error: path is required
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para leer el proyecto.
        "404":
          description: Proyecto o ruta no encontrada.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    TokenRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - password
      anyOf:
        - required:
            - username
        - required:
            - email
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - scope
        - expires_in
        - expires_at
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        scope:
          type: string
          example: project_content_api
        expires_in:
          type: integer
          example: 31536000
        expires_at:
          type: string
          format: date-time
    ProjectSummaryResponse:
      type: object
      required:
        - userId
        - projects
      properties:
        userId:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummaryItem"
    ProjectSummaryItem:
      type: object
      required:
        - project_id
        - projectName
      properties:
        project_id:
          type: string
        projectName:
          type: string
    ProjectStructureResponse:
      type: object
      required:
        - project_id
        - projectName
        - rootDocId
        - structure
      properties:
        project_id:
          type: string
        projectName:
          type: string
        rootDocId:
          type: string
        structure:
          $ref: "#/components/schemas/FolderNode"
    FolderNode:
      type: object
      required:
        - _id
        - name
        - type
        - path
        - folders
        - docs
        - files
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
          const: folder
        path:
          type: string
        folders:
          type: array
          items:
            $ref: "#/components/schemas/FolderNode"
        docs:
          type: array
          items:
            $ref: "#/components/schemas/DocNode"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileNode"
    DocNode:
      type: object
      required:
        - _id
        - name
        - type
        - path
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
          const: doc
        path:
          type: string
    FileNode:
      type: object
      required:
        - _id
        - name
        - type
        - path
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
          const: file
        path:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
