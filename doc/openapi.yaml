openapi: 3.1.0
info:
  title: Overleaf Project Content API
  version: "1.0.0"
  description: |
    API para consultar proyectos, descargar contenido y crear/sustituir ficheros por subruta.
    Los endpoints de integración externos son los que empiezan por `/api/v1/`
    y se autentican exclusivamente con `Authorization: Bearer <token>`.
servers:
  - url: /
paths:
  /api/v1/token:
    post:
      operationId: issueProjectContentApiToken
      summary: Obtener token Bearer con usuario y contraseña
      description: Emite un token Bearer para consumir la API de contenidos de proyecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              byEmail:
                value:
                  email: "user@example.com"
                  password: "my-password"
              byUsername:
                value:
                  username: "user@example.com"
                  password: "my-password"
      responses:
        "200":
          description: Token emitido correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Faltan credenciales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingFields:
                  value:
                    error: username and password are required
        "401":
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid:
                  value:
                    error: invalid_credentials
  /api/v1/user/projects/summary:
    get:
      operationId: getUserProjectsSummaryApiV1
      summary: Obtener listado simple de proyectos del usuario
      description: Devuelve los proyectos visibles por el usuario autenticado con su ID y nombre.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listado de proyectos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummaryResponse"
        "401":
          description: No autenticado.
  /api/v1/project/{Project_id}/structure:
    get:
      operationId: getProjectStructureApiV1
      summary: Obtener estructura de un proyecto
      description: Devuelve el árbol completo del proyecto (carpetas, docs y ficheros binarios).
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Estructura del proyecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStructureResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para leer el proyecto.
        "404":
          description: Proyecto no encontrado.
        "500":
          description: Error interno.
  /api/v1/project/{Project_id}/download/compiled-pdf/by-path/{path}:
    get:
      operationId: downloadCompiledPdfByPathApiV1
      summary: Compilar y descargar PDF desde una subruta LaTeX
      description: |
        Localiza un documento por su subruta y, si apunta a un documento LaTeX (`.tex`),
        compila el proyecto usando ese documento como raíz y devuelve `output.pdf`.
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
        - name: path
          in: path
          required: true
          allowReserved: true
          description: Subruta del documento `.tex` dentro del proyecto.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: PDF compilado.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Ruta inválida o no apunta a un documento LaTeX.
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para leer el proyecto.
        "404":
          description: Proyecto o ruta no encontrada.
        "500":
          description: Error de compilación o descarga.
  /api/v1/project/{Project_id}/download/by-path/{path}:
    get:
      operationId: downloadProjectEntityByPathApiV1
      summary: Descargar fichero del proyecto por subruta
      description: |
        Descarga un documento (`doc`) o fichero binario (`file`) del proyecto a partir de su subruta.
        La subruta es relativa a la raíz del proyecto (ej: `src/main.tex`).
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
        - name: path
          in: path
          required: true
          allowReserved: true
          description: Subruta del fichero dentro del proyecto.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Contenido del fichero solicitado.
        "400":
          description: La ruta es inválida o apunta a una carpeta.
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para leer el proyecto.
        "404":
          description: Proyecto o ruta no encontrada.
  /api/v1/project/{Project_id}/download/zip:
    get:
      operationId: downloadProjectAsZipApiV1
      summary: Descargar contenido completo del proyecto
      description: |
        Devuelve un archivo ZIP con todo el contenido del proyecto (docs y ficheros binarios).
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Archivo ZIP con el contenido completo del proyecto.
          headers:
            Content-Disposition:
              description: Cabecera de adjunto con el nombre del ZIP.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para leer el proyecto.
        "404":
          description: Proyecto no encontrado.
        "500":
          description: Error generando el ZIP del proyecto.
  /api/v1/project/{Project_id}/file/by-path/{path}:
    put:
      operationId: upsertProjectFileByPathApiV1
      summary: Crear o sustituir fichero del proyecto por subruta
      description: |
        Crea un fichero en la subruta indicada o sustituye su contenido si ya existe.
        El contenido puede enviarse como texto (`text/plain`) o binario (`application/octet-stream`).
      security:
        - bearerAuth: []
      parameters:
        - name: Project_id
          in: path
          required: true
          description: ID del proyecto.
          schema:
            type: string
            minLength: 1
        - name: path
          in: path
          required: true
          allowReserved: true
          description: Subruta destino del fichero dentro del proyecto.
          schema:
            type: string
            minLength: 1
          example: src/main.tex
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Fichero sustituido correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileUpsertResponse"
        "201":
          description: Fichero creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileUpsertResponse"
        "400":
          description: Ruta inválida, contenido vacío o petición no válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin permisos para escribir en el proyecto.
        "404":
          description: Proyecto no encontrado.
        "415":
          description: Tipo de contenido no soportado.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    TokenRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - password
      anyOf:
        - required:
            - username
        - required:
            - email
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - scope
        - expires_in
        - expires_at
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        scope:
          type: string
          example: project_content_api
        expires_in:
          type: integer
          example: 31536000
        expires_at:
          type: string
          format: date-time
    ProjectSummaryResponse:
      type: object
      required:
        - userId
        - projects
      properties:
        userId:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummaryItem"
    ProjectSummaryItem:
      type: object
      required:
        - project_id
        - projectName
      properties:
        project_id:
          type: string
        projectName:
          type: string
    ProjectStructureResponse:
      type: object
      required:
        - project_id
        - projectName
        - rootDocId
        - structure
      properties:
        project_id:
          type: string
        projectName:
          type: string
        rootDocId:
          type: string
        structure:
          $ref: "#/components/schemas/FolderNode"
    FolderNode:
      type: object
      required:
        - _id
        - name
        - type
        - path
        - folders
        - docs
        - files
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
          const: folder
        path:
          type: string
        folders:
          type: array
          items:
            $ref: "#/components/schemas/FolderNode"
        docs:
          type: array
          items:
            $ref: "#/components/schemas/DocNode"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileNode"
    DocNode:
      type: object
      required:
        - _id
        - name
        - type
        - path
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
          const: doc
        path:
          type: string
    FileNode:
      type: object
      required:
        - _id
        - name
        - type
        - path
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
          const: file
        path:
          type: string
    ProjectFileUpsertResponse:
      type: object
      required:
        - entity_id
        - entity_type
        - path
        - created
      properties:
        entity_id:
          type: string
        entity_type:
          type: string
          enum:
            - doc
            - file
        path:
          type: string
        created:
          type: boolean
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
